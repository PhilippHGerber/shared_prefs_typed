name: shared_prefs_typed
description: Code generator for creating type-safe, boilerplate-free SharedPreferences classes in Dart & Flutter.
repository: https://github.com/PhilippHGerber/shared_prefs_typed.git
version: 0.5.0

environment:
  sdk: ^3.7.0

resolution: workspace

dependencies:
  analyzer: ^7.7.1
  build: ^3.0.0
  build_config: ^1.1.1
  code_builder: ^4.10.1
  dart_style: ^3.1.1
  meta: ^1.16.0
  pub_semver: ^2.2.0
  shared_prefs_typed_annotations: ^0.5.0
  source_gen: ^3.0.0

dev_dependencies:
  build_runner: ^2.5.4
  build_test: ^3.3.0
  shared_preferences: ^2.5.3
  test: ^1.25.0
  very_good_analysis: ^9.0.0

topics:
  - shared-preferences
  - persistence
  - codegen
  - type-safe

screenshots:
  - description: "Shared prefs typed logo"
    path: pub/shared_prefs_typed.webp
  - description: "Example with Theme selection"
    path: pub/shared_prefs_typed_example.webp
