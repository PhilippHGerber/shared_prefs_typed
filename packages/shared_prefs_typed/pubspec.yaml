name: shared_prefs_typed
description: Code generator for creating type-safe, boilerplate-free SharedPreferences classes in Dart & Flutter.
repository: https://github.com/PhilippHGerber/shared_prefs_typed.git
version: 0.5.2

environment:
  sdk: ^3.9.0

resolution: workspace

dependencies:
  analyzer: ^10.0.1
  build: ^4.0.4
  build_config: ^1.1.2
  code_builder: ^4.10.1
  dart_style: ^3.1.1
  meta:
  pub_semver: ^2.2.0
  shared_prefs_typed_annotations: ^0.5.2
  source_gen: ^4.2.0

dev_dependencies:
  build_runner:
  build_test:
  shared_preferences: ^2.5.3
  test:
  very_good_analysis: ^10.2.0

topics:
  - shared-preferences
  - persistence
  - codegen
  - type-safe

screenshots:
  - description: "Shared prefs typed logo"
    path: pub/shared_prefs_typed.webp
  - description: "Example with Theme selection"
    path: pub/shared_prefs_typed_example.webp

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:
