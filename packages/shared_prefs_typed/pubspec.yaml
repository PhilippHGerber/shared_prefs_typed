name: shared_prefs_typed
description: Code generator for creating type-safe, boilerplate-free SharedPreferences classes in Dart & Flutter.
repository: https://github.com/PhilippHGerber/shared_prefs_typed.git
version: 1.0.1

environment:
  sdk: ^3.13.0

resolution: workspace

dependencies:
  analyzer: ^13.3.0
  build: ^4.0.4
  code_builder: ^4.10.1
  dart_style: ^3.1.1
  pub_semver: ^2.2.0
  shared_prefs_typed_annotations: ^1.0.0
  source_gen: ^4.2.0

dev_dependencies:
  build_runner: ^2.11.1
  build_test: ^3.5.7
  logging: ^1.3.0
  package_config: ^2.2.0
  shared_preferences: ^2.5.3
  test: ^1.29.0
  very_good_analysis: ^10.2.0

topics:
  - shared-preferences
  - persistence
  - codegen
  - type-safe

screenshots:
  - description: "Shared prefs typed logo"
    path: pub/shared_prefs_typed.webp
  - description: "Example with Theme selection"
    path: pub/shared_prefs_typed_example.webp

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:
