name: workspace
description: Code generator for creating type-safe, boilerplate-free SharedPreferences classes in Dart & Flutter.
publish_to: none
environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

workspace:
  - packages/shared_prefs_typed_annotations
  - packages/shared_prefs_typed
  - example/basic
  - example/advanced

dependencies:
  analyzer: ^13.3.0
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.4

dev_dependencies:
  build_runner: ^2.11.1
  build_test: ^3.5.7
  flutter_test:
    sdk: flutter
  test: ^1.29.0
  very_good_analysis: ^10.2.0

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:
