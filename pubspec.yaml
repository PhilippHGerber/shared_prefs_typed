name: workspace
description: Code generator for creating type-safe, boilerplate-free SharedPreferences classes in Dart & Flutter.
publish_to: none
environment:
  sdk: ^3.5.0

workspace:
  - packages/shared_prefs_typed_annotations
  - packages/shared_prefs_typed
  - example

dependencies:
  analyzer: ^7.7.1
  flutter:
    sdk: flutter
  meta: ^1.16.0
  shared_preferences: ^2.5.3
  shared_prefs_typed: ^0.5.2
  shared_prefs_typed_annotations: ^0.5.2

dev_dependencies:
  build_runner: ^2.5.4
  build_test: ^3.3.0
  flutter_test:
    sdk: flutter
  test: ^1.25.0
  very_good_analysis: ^9.0.0

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows: